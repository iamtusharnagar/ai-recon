[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-recon"
version = "0.1.0"
description = "Check a repo's AI-contribution policy before you invest time in it."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Tushar Nagar" }]
keywords = ["github", "cli", "ai", "open-source", "contributing"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

# Deliberately empty. See README.md#why-zero-dependencies.
dependencies = []

[project.scripts]
ai-recon = "ai_recon.cli:main"

[project.urls]
Homepage = "https://github.com/tusharnagar2002/ai-recon"
Issues = "https://github.com/tusharnagar2002/ai-recon/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_recon"]
